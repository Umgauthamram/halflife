name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install Workspace Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify No MockTelegraphClient in Production Source
        run: |
          if grep -rn --exclude="*.test.ts" --exclude="*.spec.ts" "MockTelegraphClient" apps/worker/src apps/web/app/api; then
            echo "CRITICAL: MockTelegraphClient detected in production source directories. Build rejected."
            exit 1
          fi

      - name: Build All Workspace Packages
        run: pnpm -r build

      - name: Run All Tests Across Workspace
        run: pnpm -r test
