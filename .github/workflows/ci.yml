name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pinned pnpm
        run: npx --yes pnpm@10.28.0 --version

      - name: Install Workspace Dependencies
        run: npx --yes pnpm@10.28.0 install --frozen-lockfile

      - name: Typecheck
        run: npx --yes pnpm@10.28.0 --filter "@half-life/*" typecheck

      - name: Run All Tests (Vitest)
        run: npx --yes pnpm@10.28.0 test

      - name: Build Web Application
        run: npx --yes pnpm@10.28.0 --filter @half-life/web build

